name: Live (manual)

# 手动触发的联网冒烟测试：真实连接通达信服务器。
# 在 Actions 页面点击 "Run workflow"（或 gh workflow run live.yml）。
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "测试范围"
        required: true
        default: "integration"
        type: choice
        options:
          - integration   # tests/integration 全量
          - smoke         # 仅核心连通性
      python-version:
        description: "Python 版本"
        required: true
        default: "3.12"
        type: string

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XMTDX_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Connectivity smoke
        if: ${{ inputs.scope == 'smoke' }}
        run: |
          python - <<'PY'
          from easy_tdx import TdxClient, MacClient, Market
          with TdxClient.from_best_host(timeout=10) as c:
              quotes = c.get_security_quotes([(Market.SH, "600519")])
              assert len(quotes) >= 1, "标准协议行情返回为空"
          with MacClient.from_best_host(timeout=10) as c:
              kline = c.get_stock_kline(1, "600519", count=5)
              assert len(kline) >= 1, "MAC 协议 K 线返回为空"
          print("live smoke OK")
          PY
      - name: Integration tests
        if: ${{ inputs.scope == 'integration' }}
        run: pytest tests/integration/ -v

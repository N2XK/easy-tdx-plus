[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easy-tdx-plus"
dynamic = ["version"]
description = "通达信 TCP 协议行情数据客户端，支持在线行情与离线本地数据读取"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "N2XK" }]
keywords = ["tdx", "tongdaxin", "通达信", "stock", "quant", "行情", "A股", "pytdx"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["pandas>=2.0", "tzdata>=2024.1", "click>=8.0"]

[project.urls]
Homepage = "https://github.com/N2XK/easy_tdx"
Repository = "https://github.com/N2XK/easy_tdx"
Issues = "https://github.com/N2XK/easy_tdx/issues"
Changelog = "https://github.com/N2XK/easy_tdx/blob/main/CHANGELOG.md"
Documentation = "https://github.com/N2XK/easy_tdx/blob/main/docs/数据字典.md"

[project.scripts]
easy-tdx = "easy_tdx.cli:cli"  # cli/__init__.py exposes the click group

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "mypy>=1.9", "ruff>=0.4"]

[tool.hatch.version]
path = "src/easy_tdx/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/easy_tdx"]

[tool.mypy]
strict = true
python_version = "3.10"

# numpy 自带 stub 使用 3.12+ 语法，与项目的 3.10 目标不兼容；跳过其类型检查。
# pandas / tabulate 依赖第三方 stub（pandas-stubs / types-tabulate），这里不作为强制
# 依赖，统一忽略其缺失 stub，仅对项目自身代码保持 strict。
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "tabulate", "tabulate.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# 示例中含较长的中文说明/输出注释，放宽行长限制
"examples/**" = ["E501"]

[tool.coverage.run]
source = ["easy_tdx"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 50
exclude_lines = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]
